<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Network preview</title>
<style>body{font:15px system-ui;padding:24px;color:#151515}h2{font-size:20px;margin:0 0 20px}.row{display:flex;align-items:center;gap:12px;padding:18px;border:1px solid #ddd;border-radius:5px;max-width:600px}.name{flex:1}small{color:#666;display:block}.pill{background:#e7f4e4;color:#1d6b1d;border-radius:20px;padding:4px 10px}button{padding:7px 14px;border:1px solid #aaa;background:white;border-radius:4px;cursor:pointer}</style>
<h2>Network</h2><div class="row"><div class="name"><strong>Wired connection</strong><small>Preview network adapter · Ethernet</small></div><span class="pill" id="status">Connected</span><button id="toggle">Disconnect</button></div>
<script>document.getElementById('toggle').onclick=function(){const connected=this.textContent==='Disconnect';this.textContent=connected?'Connect':'Disconnect';document.getElementById('status').textContent=connected?'Disconnected':'Connected';};</script></html>
